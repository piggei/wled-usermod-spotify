; WLED 17 external-usermod fragment for the Waveshare Spotify development env.
; Merge this into the existing Waveshare profile; do not duplicate the other
; board/user-mod flags already used by the target.
;
; WLED is only the PlatformIO build tree. The Spotify module is a sibling repo:
;   ~/repo/wled_17_dev
;   ~/repo/wled-usermod-spotify

[env:waveshare_spotify]
extends = env:waveshare_esp32s3_32MB_hub75

custom_usermods =
  ; ...retain the existing Waveshare/iDotMatrix usermods here...
  wled-usermod-spotify = symlink://../wled-usermod-spotify
