; WLED 17 external-usermod fragment for the Waveshare Spotify development env.
; Merge this into the existing Waveshare profile; do not duplicate the other
; board/user-mod flags already used by the target.
;
; WLED is only the PlatformIO build tree. The Spotify module is a sibling repo:
;   ~/repo/wled_17_dev
;   ~/repo/wled-usermod-spotify
;
; dev.2n-r1 proved that the dependency declared by the symlinked usermod's
; library.json is not materialized automatically in this WLED environment:
; compilation stopped before decoder code at micro_vorbis/ogg_vorbis_decoder.h.
; dev.2n-r2 then proved that explicit lib_deps alone is not sufficient under
; WLED's Arduino framework: upstream micro-vorbis is published/documented as an
; ESP-IDF library, so PlatformIO's default framework compatibility filter can
; download it but still exclude it from the Arduino compilation include path.
; dev.2n-r3 proved that this gets PlatformIO into the micro-vorbis sources. The
; next failure is now inside the upstream package: Tremor cannot see ogg/ogg.h
; and ogg_vorbis_decoder.cpp cannot see ivorbiscodec.h. These are private CMake
; include directories that the generic Arduino library builder does not import.
; dev.2n-r4 added the private-include bridge, but the first real r4 compile exposed
; a PlatformIO composition bug in this example: assigning extra_scripts replaced
; WLED's inherited scripts_defaults list, so core load_usermods/build scripts were
; skipped and unrelated wled_espnow could no longer include wled.h. dev.2n-r5 keeps
; the complete WLED script chain and appends the micro-vorbis bridge. Its real
; target compile then reached final link and exposed unresolved micro_ogg::OggDemuxer
; methods: the nested lib/micro-ogg-demuxer CMake target was not being compiled by
; PlatformIO's Arduino library builder. dev.2n-r6+ keeps the same override and extends
; the bridge script to compile that bundled src/ tree. The WLED framework remains
; Arduino.

[env:waveshare_spotify]
extends = env:waveshare_esp32s3_32MB_hub75

lib_compat_mode = off

extra_scripts =
  ${scripts_defaults.extra_scripts}
  pre:../wled-usermod-spotify/tools/platformio_micro_vorbis_compat.py

lib_deps =
  ${env:waveshare_esp32s3_32MB_hub75.lib_deps}
  esphome/micro-vorbis@^0.1.0

custom_usermods =
  ; ...retain the existing Waveshare/iDotMatrix usermods here...
  wled-usermod-spotify = symlink://../wled-usermod-spotify
